<h2>{{ displayName }}</h2>

<table>

  <thead>
  <tr>
    <th>Pos</th>
    <th>Player</th>
    <th>Played</th>
    <th>Score</th>
  </tr>
  </thead>

  <tbody>

    @for (player of leaderboardEntries; track player.position) {

      <tr>
        <td>{{ player.position }}</td>
        <td>{{ player.playerName }}</td>
        <td>{{ player.gamesPlayed }}</td>
        <td>{{ player.totalScore }}</td>
      </tr>

    }

  </tbody>

</table>
