<section class="leaderboard-active">
  <div class="leaderboard-header">
    <h3 class="leaderboard-heading">Results</h3>

    <mat-form-field appearance="outline" class="player-filter">
      <mat-label>Search players</mat-label>
      <input
        matInput
        type="search"
        (input)="applyFilter($event)"
        placeholder="Enter a player name">
    </mat-form-field>
  </div>

  <div class="table-scroll">
    <table class="leaderboard-table" mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="position">
        <th mat-header-cell *matHeaderCellDef mat-sort-header scope="col">Position</th>
        <td mat-cell *matCellDef="let entry">
          @if (podiumImage(entry.position); as image) {
            <img
              class="podium-symbol"
              [src]="image"
              [alt]="placeLabel(entry.position)">
          }
          <span class="position-label">{{ entry.position }}.</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="playerName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header scope="col">Player Name</th>
        <td mat-cell *matCellDef="let entry">{{ entry.playerName }}</td>
      </ng-container>

      <ng-container matColumnDef="gamesPlayed">
        <th mat-header-cell *matHeaderCellDef mat-sort-header scope="col">Games Played</th>
        <td mat-cell *matCellDef="let entry">{{ entry.gamesPlayed }}</td>
      </ng-container>

      <ng-container matColumnDef="totalScore">
        <th mat-header-cell *matHeaderCellDef mat-sort-header scope="col">Total Score</th>
        <td mat-cell *matCellDef="let entry">{{ entry.totalScore }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let entry; columns: displayedColumns; let index = index"
        [attr.data-player]="serializePlayer(entry, index)">
      </tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty-state" [attr.colspan]="displayedColumns.length">
          No leaderboard entries found.
        </td>
      </tr>
    </table>
  </div>
</section>
