<h2>{{ displayName }}</h2>

<table>

  <thead>
  <tr>
    <th>Player</th>
    <th>Score</th>
  </tr>
  </thead>
  <tbody>
    @for (result of resultDtos; track resultDtos.indexOf(result)) {
      <tr>
        <td>{{ result.playerName }}</td>
        <td>{{ result.score }}</td>
      </tr>
    }
  </tbody>
  </table>
