<h3 class="results-heading">{{ displayName }}</h3>

<div class="table-scroll">
  <table class="results-table">
    <thead>
      <tr>
        <th scope="col">Player</th>
        <th scope="col">Score</th>
      </tr>
    </thead>
    <tbody>
      @for (result of resultDtos(); track result.id) {
        <tr>
          <td>{{ result.playerName }}</td>
          <td>{{ result.score }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
